# .github/workflows/metrics.yml
#
# Generates github-metrics.svg into the repo root once a day.
# Referenced in README.md as:  ![Metrics](./github-metrics.svg)
#
# SETUP (one-time):
#   Create a CLASSIC Personal Access Token (read-only intent) with scopes:
#     - read:user        (required)
#     - repo             (only if you want PRIVATE repos included; else public_repo)
#     - read:org         (only if you want organisation data)
#   Add it as a repo secret named METRICS_TOKEN  (Settings -> Secrets and
#   variables -> Actions -> New repository secret). Never put it in this file.

name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch:       # lets you run it manually the first time

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: FluffyHorizon1
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/London

          # Isometric contribution calendar (the 3D year view)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Language breakdown
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # Coding habits / most active hours
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes
